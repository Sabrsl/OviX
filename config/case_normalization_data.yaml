# Case Normalization Reference Data
# Ce fichier contient toutes les données de référence pour la normalisation de la casse
# Modifiable facilement sans toucher au code source
#
# IMPORTANT — règle de sécurité pour tout mainteneur :
# N'ajoutez JAMAIS d'entrée d'une seule lettre ou d'un seul chiffre dans
# `acronyms`, `official_names` ou `preserved_expressions`. Le code applique
# une correspondance par mot entier (\b...\b), mais une entrée à 1 caractère
# reste risquée (ambiguïté, faux positifs sur ponctuation/diacritiques).
# Minimum recommandé : 2 caractères.

