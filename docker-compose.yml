version: '3.8'

services:
  app:
    build: .
    container_name: syns_operator_bot
    ports:
      - "8501:8501"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./user-config.py:/app/user-config.py
      - ./passwords.py:/app/passwords.py
    environment:
      - PYTHONUNBUFFERED=1
      - PYWIKIBOT_DIR=/app
      # Pass through from the host/CI shell if set (no file needed in production)
      - WIKIPEDIA_USERNAME
      - WIKIPEDIA_PASSWORD
    env_file:
      # Optional: local development convenience only, never required in production
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: Ollama for local AI
  ollama:
    image: ollama/ollama:latest
    container_name: syns_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    profiles:
      - ai

volumes:
  ollama_data:
