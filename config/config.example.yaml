# OVIX Configuration File (Example)
# Copy this file to config.yaml and customize for your environment
# All parameters can also be managed from the UI Settings page

# Project paths
project_root: /path/to/ovix

# Wikipedia connection settings
wikipedia:
  lang: fr
  family: wikipedia
  api_url: null
  user_agent: null
  timeout: 30.0

# Rate limiting configuration
rate_limiting:
  min_edit_delay: 1.0
  max_edits_per_minute: 10
  max_requests_per_second: 2.0
  burst: 5

# API throttling configuration (advanced)
api_throttling:
  max_requests_per_minute: 10
  max_requests_per_minute_max: 15
  max_requests_per_minute_min: 10
  max_retries: 5
  maxlag: 10
  min_delay: 11.5
  min_delay_max: 15
  min_delay_min: 8
  random_delay: true
  retry_backoff_factor: 2
  retry_delay: 5

# Analysis configuration
analysis:
  enabled_analyzers:
    - DeadLinkAnalyzer
  enable_dead_link_analyzer: true
  enable_http_links_analyzer: false  # Controlled by https_verification.enabled
  min_severity: all
  disabled_issue_types: []
  issue_overrides: {}
  parallel: false
  analyzer_timeout: 60.0
  enable_case_normalization: true
  enable_ner_title_normalization: true  # Requires spaCy + fr_core_news_sm model
  normalize_with_ai: false  # Enable AI-assisted normalization using Gemini (only if enable_case_normalization is true)

# Database configuration
database:
  path: data/wikipedia_maintenance.db
  backup_enabled: true
  backup_interval_hours: 24
  max_backups: 7
  pragmas:
    journal_mode: WAL
    synchronous: NORMAL
    cache_size: -64000

# Daily article collection configuration
daily_collection:
  batch_size: 100
  category: Article à wikifier/Liste complète
  enabled: true
  exclude_analyzed: true
  exclude_published: true
  max_articles: 500

# UI configuration
ui:
  theme: dark
  max_issues_display: 100
  auto_expand_high_severity: true
  show_diff_by_default: true
  compact_view: false

# Safety configuration
safety:
  dry_run_default: true
  require_confirmation: true
  max_article_batch_size: 50
  max_edits_per_session: 100
  max_change_bytes: 50000
  excluded_namespaces:
    - 0
    - 4
    - 10
  enforce_edit_summary: true
  default_edit_summary: Corrections automatiques ([[Projet:Maintenance]])

# Safety configuration
safety:
  dry_run_default: true
  require_confirmation: true
  max_article_batch_size: 50
  max_edits_per_session: 100
  max_change_bytes: 50000
  excluded_namespaces:
    - 0
    - 4
    - 10
  enforce_edit_summary: true
  default_edit_summary: Corrections automatiques ([[Projet:Maintenance]])

# Logging configuration
logging:
  level: INFO
  file: logs/wikipedia_maintenance.log
  max_size_mb: 10
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
  console: true

# Typography analyzer configuration
typography:
  check_nbsp: true
  max_issues: null
  check_ordinal_abbreviations: true
  check_percent_nbsp: false
  check_double_spaces: true
  check_simple_punctuation_spacing: true
  check_abusive_formatting: true
  check_all_caps: true
  check_abbreviations: true
  check_dates: true
  check_centuries: true
  check_units: true
  check_section_titles: true

# XML Typography analyzer configuration
typography_xml_analyzer:
  enabled: false  # Enable XML-based typo correction using normalise_typo.xml
  xml_rules_path: null  # Custom path to XML rules file (null for default: src/wikipedia_maintenance/analyzers/normalise_typo.xml)
  max_corrections_per_article: 100  # Maximum number of typo corrections to apply per article
  ignore_protected_areas: true  # Skip corrections in nowiki, comments, and other protected areas
  case_sensitive: false  # Whether regex matching should be case-sensitive

# References analyzer configuration
references:
  check_bare_refs: true
  check_duplicate_refs: true
  check_uppercase_refs: true
  check_isbn_format: true
  check_template_type: true
  check_broken_links: false
  use_wayback_api: false
  link_check_timeout: 5.0

# References analyzer configuration
references:
  check_bare_refs: true
  check_duplicate_refs: true
  check_uppercase_refs: true
  check_isbn_format: true
  check_template_type: true
  check_broken_links: false
  use_wayback_api: false
  link_check_timeout: 5.0

# Dead link analyzer configuration
dead_links_analyzer:
  timeout: 10  # Link check timeout in seconds
  max_retries: 3  # Maximum retry attempts for failed checks
  max_checks_per_article: 6  # Maximum URLs to check per article
  enable_auto_repair: true  # Whether to automatically repair dead links
  assume_wikipedia_patch_deployed: false  # Whether to assume Wikipedia Lua patch is deployed

  # Advanced configuration
  archive_search:
    enabled: true
    health_check_interval: 300
    wayback_enabled: true
  candidate_search:
    enabled: true
    max_candidates: 3
    same_domain_only: true
    try_http_fallback: true
  confidence_threshold: 0.95
  prefer_redirect_over_archive: true
  repair:
    fail_on_ambiguity: true
    replace_url_only: true
    require_minimal_diff: true
  validation:
    min_confidence_threshold: 0.7
    require_archive_evidence: true
    require_same_domain: true
    require_title_match: true
    require_unique_candidate: true

# Reference enricher analyzer configuration
reference_enricher_analyzer:
  enabled: true  # Whether to enable the reference enricher analyzer
  timeout: 10  # Link check timeout in seconds
  max_retries: 3  # Maximum retry attempts for failed checks
  max_checks_per_article: 50  # Maximum URLs to check per article
  enable_site_fill: true  # Whether to auto-fill |site= parameter
  enable_consulte_le_fill: true  # Whether to auto-fill |consulté le= parameter

# HTTPS verification configuration
https_verification:
  enabled: false
  timeout: 10.0
  ttl_available: 30
  ttl_unavailable: 7
  ttl_failed: 1

# Works list analyzer configuration
works_list:
  filmography_threshold: 3
  discography_threshold: 3
  check_awards: true
  check_italics: true
  check_lang_template: true
  check_sort_order: true

# Structure analyzer configuration
structure:
  check_heading_levels: true
  check_duplicate_sections: true
  check_voir_aussi_algorithm: true
  check_portal_placement: true
  check_section_order: true
  check_empty_sections: true

# Timeouts for external APIs
timeouts:
  wikipedia_api: 30.0
  analyzer: 60.0
  link_check: 10.0
  https_verification: 10.0
  wayback_cdx: 5.0
  archive_org: 10.0
  archive_check: 5.0
  connection_check: 5.0

# AI/LLM configuration for Gemini
ai:
  gemini:
    api_key: "your-gemini-api-key"  # Get from https://makersuite.google.com/app/apikey
    project_id: "your-project-id"  # Google Cloud project ID
    model: "gemini-1.5-flash"  # Model to use: gemini-1.5-flash, gemini-1.5-pro, etc.
    limit: 10000  # Character limit for AI processing

# API URLs configuration
api_urls:
  gemini: "https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
  wikipedia: https://{lang}.wikipedia.org/w/api.php

# Other configuration
other:
  user_agent: OviX/3.2

# Publication delays configuration
publication_delays:
  max_delay_minutes: 7
  min_delay_minutes: 4

# Scheduler configuration
scheduler:
  daily_limit: 500
  working_hours_end: 23
  working_hours_start: 0

# Domain to site name enrichment configuration
domain_to_site_name_enrichment:
  enabled: true
  dry_run_default: true  # If true, only analyze without writing to YAML
  
  # Categories to process (sorted by priority)
  categories:
    # Priority 1 - Médias
    - wiki: fr
      category: "Média français"
      priority: 1
    - wiki: fr
      category: "Agence de presse"
      priority: 1
    - wiki: fr
      category: "Presse écrite"
      priority: 1
    - wiki: fr
      category: "Média en ligne"
      priority: 1
    
    # Priority 2 - Technologie
    - wiki: fr
      category: "Entreprise de télécommunications"
      priority: 2
    - wiki: fr
      category: "Entreprise informatique"
      priority: 2
    - wiki: fr
      category: "Site web"
      priority: 2
    
    # Priority 3 - Entreprises
    - wiki: fr
      category: "Entreprise française"
      priority: 3
    - wiki: fr
      category: "Entreprise par pays"
      priority: 3
    
    # Priority 4 - Radio / Télévision
    - wiki: fr
      category: "Radio française"
      priority: 4
    - wiki: fr
      category: "Chaîne de télévision française"
      priority: 4
    
    # Priority 5 - Bibliothèques / Documentation
    - wiki: fr
      category: "Bibliothèque"
      priority: 5
    - wiki: fr
      category: "Bibliothèque nationale"
      priority: 5
    - wiki: fr
      category: "Bibliothèque universitaire"
      priority: 5
